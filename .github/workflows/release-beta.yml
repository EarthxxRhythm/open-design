name: release-beta
run-name: "[experiment] plan benefit — ${{ inputs.round }}"

# Temporary replacement on the authorized experiment branch only.
# No workflow_call, channel publisher, latest pointer, PR, or production cache.
on:
  workflow_dispatch:
    inputs:
      round:
        description: Controlled four-round measurement
        required: true
        type: choice
        options: [cold, hot, source, test]
        default: cold

permissions:
  contents: read

concurrency:
  group: architecture-benefit-boundaries
  cancel-in-progress: false

env:
  OD_WEB_OUTPUT_MODE: standalone
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  plan:
    name: "[plan] ideal build and test reuse"
    if: github.repository == 'nexu-io/open-design' && github.ref == 'refs/heads/experiment/architecture-benefit-boundaries'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      test_run: ${{ steps.plan.outputs.test_run }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
      - name: "[plan] probe experimental receipts"
        id: plan
        env:
          OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
          EXPERIMENT_ROUND: ${{ inputs.round }}
        run: python3 .github/scripts/release/architecture_experiment.py plan --round "$EXPERIMENT_ROUND"

  distribution:
    name: "[build] selected content + signed macOS distribution"
    needs: plan
    runs-on: macos-14
    timeout-minutes: 40
    env:
      EXPERIMENT_PLAN: ${{ needs.plan.outputs.plan }}
      OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
      CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
      CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
      CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
      CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: "[setup] dependencies without aggregate postinstall"
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: "[setup] native dependencies and vendor bundle"
        run: python3 .github/scripts/release/architecture_experiment.py setup
      - name: "[build] execute misses and restore exact component outputs"
        run: python3 .github/scripts/release/architecture_experiment.py build
      - name: "[release] fresh signing, notarization and dogfood upload"
        env:
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OD_VELA_WEB_URL: ${{ secrets.VELA_WEB_URL_PROD }}
          OD_VELA_WEB_URL_FEATURE_TEST: ${{ secrets.VELA_WEB_URL_FEATURE_TEST }}
          OD_VELA_WEB_URL_TEST: ${{ secrets.VELA_WEB_URL_TEST }}
          OD_VELA_WEB_URL_PROD: ${{ secrets.VELA_WEB_URL_PROD }}
          RELEASE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_R2_RELEASES_PUBLIC_ORIGIN }}
          RELEASE_STORAGE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_RELEASES_AK }}
          RELEASE_STORAGE_BUCKET: ${{ secrets.CLOUDFLARE_R2_RELEASES_BUCKET }}
          RELEASE_STORAGE_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_RELEASES_URL }}
          RELEASE_STORAGE_REGION: auto
          RELEASE_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_RELEASES_SK }}
        run: python3 .github/scripts/release/architecture_experiment.py native
      - name: "[report] retain small measurement files"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-distribution-measurements
          path: .tmp/architecture-experiment/*.json
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: "[test] web source and test-input result (${{ matrix.shard }}/2)"
    needs: plan
    if: needs.plan.outputs.test_run == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      OD_WEB_OUTPUT_MODE: ""
      EXPERIMENT_PLAN: ${{ needs.plan.outputs.plan }}
      OD_WORKLOAD_RESULTS_BASE_URL: ${{ secrets.OD_WORKLOAD_RESULTS_BASE_URL }}
      CLOUDFLARE_R2_WORKLOAD_RESULTS_URL: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_URL }}
      CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_BUCKET }}
      CLOUDFLARE_R2_WORKLOAD_RESULTS_AK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_AK }}
      CLOUDFLARE_R2_WORKLOAD_RESULTS_SK: ${{ secrets.CLOUDFLARE_R2_WORKLOAD_RESULTS_SK }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: "[setup] test dependencies"
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: "[test] run real web tests and publish successful proof"
        env:
          EXPERIMENT_SHARD: ${{ matrix.shard }}
        run: python3 .github/scripts/release/architecture_experiment.py test --shard "$EXPERIMENT_SHARD"
