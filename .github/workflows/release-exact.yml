name: release-exact
run-name: "[experiment] notarization factors — ${{ inputs.group }}"
on:
  workflow_dispatch:
    inputs:
      group:
        description: First factorial screen or focused repeat
        type: choice
        default: screen
        options: [screen, count-small, count-large, bytes-few, bytes-many, endpoints]
permissions:
  contents: read
concurrency:
  group: architecture-notarization-factors
  cancel-in-progress: false
jobs:
  select:
    name: "[plan] bounded notarization sample selection"
    if: github.repository == 'nexu-io/open-design' && github.ref == 'refs/heads/experiment/architecture-benefit-boundaries'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          GROUP: ${{ inputs.group }}
        run: |
          python3 - <<'PY'
          import json, os
          groups = {
            "screen": ["full", "few-small", "many-small", "few-large", "many-large"],
            "count-small": ["few-small", "many-small"],
            "count-large": ["few-large", "many-large"],
            "bytes-few": ["few-small", "few-large"],
            "bytes-many": ["many-small", "many-large"],
            "endpoints": ["full", "few-small"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps(groups[os.environ["GROUP"]]) + "\n")
          PY
  measure:
    name: "[measure] Apple payload factors / ${{ matrix.variant }}"
    needs: select
    runs-on: macos-14
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: "[prepare] checksum-pinned signed Electron and controlled payload"
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
        run: python3 .github/scripts/release/notarization_factors.py prepare "$VARIANT"
      - name: "[measure] one submission, isolated Apple wait and ticket validation"
        env:
          VARIANT: ${{ matrix.variant }}
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 .github/scripts/release/notarization_factors.py measure "$VARIANT"
      - name: "[report] small measurements only, no packages or release writes"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notary-factors-${{ matrix.variant }}
          path: .tmp/notarization-factors/reports/
          if-no-files-found: warn
          retention-days: 14
